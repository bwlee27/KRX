name: Update KRX Stocks

on:
  schedule:
    - cron: "0 22 * * 0-4"
  # 분	0	0분
  # 시	22	22시 (UTC)
  # 일	*	매일
  # 월	*	매월
  # 요일	0-4	일~목
  # UTC 22:00 = KST 07:00 (다음날)

  # 즉, 월~금 오전 7시(KST) 에 실행됩니다.

  # 그런데 한국 주식시장은 15:30에 마감하므로, 오전 7시 실행은 당일 시장이 열리기 전입니다. 전날 데이터를 가져오게 됩니다.

  # 장 마감 후 데이터를 가져오려면 KST 16:00 이후 = UTC 07:00 이후로 변경하는 게 맞습니다:
  # cron: '0 7 * * 1-5'  # UTC 07:00 = KST 16:00, 월~금

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python update_stock_list.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

      - name: Commit

        run: |

          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

          git add data/stocks.csv

          git diff --cached --quiet || \
          git commit -m "Auto update"

          git push
